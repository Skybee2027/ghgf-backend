# GHGF Agent Configuration
# 10-robot autonomous blog system

agents:
  GHGF_1:
    name: "Trend Discovery Agent"
    enabled: true
    schedule: "0 8 * * *"
    type: "trend_discovery"
    tasks:
      - task_id: "1.1"
        name: "Discover Trending Health Topics"
        ai_provider: "gemini_free"
        parameters:
          trend_sources: ["google_trends", "reddit"]
          category: "health"
          min_relevance: 5

  GHGF_2:
    name: "Outline Generator Agent"
    enabled: true
    schedule: "0 8 15 * * *"
    type: "outline_generation"
    dependencies: ["GHGF_1"]
    tasks:
      - task_id: "2.1"
        name: "Generate Blog Outlines"
        ai_provider: "claude_free"
        parameters:
          sections: 5

  GHGF_3:
    name: "Content Writer Agent"
    enabled: true
    schedule: "0 8 30 * * *"
    type: "content_writing"
    dependencies: ["GHGF_2"]
    tasks:
      - task_id: "3.1"
        name: "Write Blog Posts"
        ai_provider: "gemini_free"
        parameters:
          post_length: 1500
          tone: "informative"

  GHGF_3_5:
    name: "Image Generator Agent"
    enabled: true
    schedule: "0 9 * * *"
    type: "image_generation"
    dependencies: ["GHGF_3"]
    tasks:
      - task_id: "3.5.1"
        name: "Generate Featured Images"
        ai_provider: "gemini_free"

  GHGF_4:
    name: "Affiliate Research Agent"
    enabled: true
    schedule: "0 10 * * *"
    type: "affiliate_research"
    dependencies: ["GHGF_3"]
    tasks:
      - task_id: "4.1"
        name: "Research Affiliate Products"
        ai_provider: "gemini_free"

  GHGF_5:
    name: "Content Reviewer Agent"
    enabled: true
    schedule: "0 11 * * *"
    type: "content_review"
    dependencies: ["GHGF_3"]
    tasks:
      - task_id: "5.1"
        name: "Review Content Quality"
        ai_provider: "claude_free"
        parameters:
          quality_threshold: 7.5

  GHGF_6:
    name: "Compliance Checker Agent"
    enabled: true
    schedule: "0 11 30 * * *"
    type: "compliance_check"
    dependencies: ["GHGF_5"]
    tasks:
      - task_id: "6.1"
        name: "Check FTC Compliance"
        ai_provider: "gemini_free"

  GHGF_7:
    name: "WordPress Publisher Agent"
    enabled: true
    schedule: "0 12 * * *"
    type: "wordpress_publishing"
    dependencies: ["GHGF_6", "GHGF_3_5", "GHGF_4"]
    tasks:
      - task_id: "7.1"
        name: "Publish to WordPress"

  GHGF_8:
    name: "Performance Monitor Agent"
    enabled: true
    schedule: "0 17 * * *"
    type: "performance_monitoring"
    tasks:
      - task_id: "8.1"
        name: "Monitor Website Performance"

  GHGF_9:
    name: "SEO Optimizer Agent"
    enabled: true
    schedule: "0 17 30 * * *"
    type: "seo_optimization"
    dependencies: ["GHGF_7"]
    tasks:
      - task_id: "9.1"
        name: "Optimize for SEO"
        ai_provider: "gemini_free"
