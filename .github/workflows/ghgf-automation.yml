name: GHGF Daily Automation
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ghgf-pipeline:
    name: GHGF Autonomous Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # AI Providers
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
      REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
      
      # WordPress
      WORDPRESS_SITE_URL: ${{ secrets.WORDPRESS_SITE_URL }}
      WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
      WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
      
      # Image Sources
      UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      
      # Email & Marketing
      MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
      
      # Affiliate Networks
      CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
      CJ_PUBLISHER_ID: ${{ secrets.CJ_PUBLISHER_ID }}
      SHAREASALE_API_KEY: ${{ secrets.SHAREASALE_API_KEY }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create Directories
        run: mkdir -p config data/{logs,cache,images}
      
      - name: Run GHGF Pipeline
        run: python ghgf_orchestrator.py
      
      - name: Archive Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: data/logs/
          retention-days: 30
